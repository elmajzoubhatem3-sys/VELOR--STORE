<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NovaCart</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>

  <header class="top">
    <div class="brand">NovaCart</div>
    <div class="topline">🚚 توصيل سريع • 💵 دفع عند الاستلام • 🔒 آمن</div>

    <div class="actions">
      <input id="search" placeholder="إبحث عن المنتج..." />
      <button id="goCart">🛒 السلة (<span id="cartCount">0</span>)</button>
    </div>

    <nav class="cats" id="cats"></nav>
  </header>

  <main class="wrap">
    <section class="hero" id="hero">
      <div class="slider" id="slider"></div>
      <div class="dots" id="dots"></div>
    </section>

    <section class="grid" id="grid"></section>
  </main>

  <dialog id="cartModal" class="modal">
    <div class="modalHead">
      <b>سلة NovaCart</b>
      <button id="closeCart">✖</button>
    </div>

    <div id="cartItems"></div>
    <div class="total">المجموع: <span id="total">0</span>$</div>

    <form id="checkout" class="checkout">
      <input required name="name" placeholder="الاسم" />
      <input required name="phone" placeholder="رقم الهاتف" />
      <input required name="address" placeholder="العنوان" />
      <select name="payment" required>
        <option value="">طريقة الدفع</option>
        <option value="COD">الدفع عند الاستلام</option>
      </select>
      <button type="submit">تأكيد الطلب</button>
      <small class="note">سيتم التواصل لتأكيد الطلب قبل الشحن.</small>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
