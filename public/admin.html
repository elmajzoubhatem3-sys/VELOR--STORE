<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NovaCart Admin</title>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    .adminWrap{max-width:900px;margin:0 auto;padding:18px}
    .panel{border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.06);padding:16px;margin-top:14px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:700px){.row2{grid-template-columns:1fr}}
    .adminWrap h2{margin:0 0 10px}
    .hint{opacity:.8;font-size:13px;margin-top:6px}
    .ok{color:#22c55e;font-weight:800}
    .err{color:#ff6b6b;font-weight:800}
    .btn2{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#ff7a00;cursor:pointer;font-weight:900;color:#111}
    .btn3{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);cursor:pointer;font-weight:900;color:#fff}
    input,select,textarea{width:100%}
    textarea{min-height:90px;resize:vertical}
  </style>
</head>
<body>

  <header class="top">
    <div class="brand">NovaCart — Admin</div>
    <div class="topline">إضافة منتجات بسهولة بدون تعديل كود</div>
    <div class="actions">
      <a href="/" class="btn3" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">⬅ رجوع للمتجر</a>
      <button id="logout" class="btn3">تسجيل خروج</button>
    </div>
  </header>

  <main class="adminWrap">

    <section class="panel" id="loginPanel">
      <h2>تسجيل دخول</h2>
      <form id="loginForm" class="checkout">
        <input name="email" required placeholder="الإيميل" value="admin@novacart.com"/>
        <input name="password" required placeholder="الباسورد" type="password" value="ChangeMe123!"/>
        <button class="btn2" type="submit">Login</button>
        <div id="loginMsg" class="hint"></div>
      </form>
    </section>

    <section class="panel" id="addPanel" style="display:none;">
      <h2>إضافة منتج</h2>

      <div class="hint">📌 الصور: حط الصورة داخل <b>public/image</b> وخلي المسار مثل: <b>/image/pot.jpg</b></div>

      <form id="productForm" class="checkout" style="margin-top:10px;">
        <div class="row2">
          <input name="title" required placeholder="اسم المنتج"/>
          <input name="price" required placeholder="السعر (مثال: 12.99)" type="number" step="0.01" min="0"/>
        </div>

        <div class="row2">
          <select name="category" required>
            <option value="">اختار الفئة</option>
            <option value="Home & Kitchen">Home & Kitchen البيت والمطبخ</option>
            <option value="Toys">Toys الألعاب</option>
            <option value="Electronics">Electronics كهربائيات</option>
            <option value="Beauty">Beauty جمال</option>
            <option value="Fashion">Fashion أزياء</option>
          </select>
          <input name="stock" placeholder="الستوك (مثال: 50)" type="number" step="1" min="0" value="10"/>
        </div>

        <input name="image" required placeholder="صورة المنتج (مثال: /image/pot.jpg)"/>
        <textarea name="description" required placeholder="وصف المنتج"></textarea>

        <button class="btn2" type="submit">إضافة المنتج</button>
        <div id="prodMsg" class="hint"></div>
      </form>

      <hr style="border:0;border-top:1px solid rgba(255,255,255,.12);margin:14px 0"/>

      <button id="refresh" class="btn3">عرض آخر المنتجات</button>
      <div id="list" style="margin-top:10px"></div>
    </section>

  </main>

  <script src="/admin.js"></script>
</body>
</html>
