<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin</title>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    .adminWrap{max-width:900px;margin:0 auto;padding:18px}
    .panel{border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.06);padding:16px;margin-top:14px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:700px){.row2{grid-template-columns:1fr}}

    .btnA{padding:12px 14px;border-radius:12px;border:0;background:#ff7a00;cursor:pointer;font-weight:900}
    .btnB{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);cursor:pointer;font-weight:900;color:#fff}
    .hint{opacity:.85;font-size:13px;margin-top:8px}

    .listHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
    .listBox{margin-top:10px}
  </style>
</head>
<body>

  <header class="top">
    <div class="brand">Admin Panel</div>
    <div class="topline">تسجيل دخول + إضافة منتجات</div>
    <div class="actions">
      <a class="btnB" href="/" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">⬅ رجوع للمتجر</a>
      <button class="btnB" id="logout" type="button">تسجيل خروج</button>
    </div>
  </header>

  <main class="adminWrap">

    <!-- LOGIN -->
    <section class="panel" id="loginPanel">
      <h2 style="margin:0 0 10px;">تسجيل دخول</h2>
      <form id="loginForm" class="checkout">
        <input name="email" required placeholder="الإيميل" value="admin@veloré.com"/>
        <input name="password" required placeholder="الباسورد" type="password" value="ChangeMe123!"/>
        <button class="btnA" type="submit">Login</button>
        <div class="hint" id="loginMsg"></div>
      </form>
    </section>

    <!-- ADD PRODUCT -->
    <section class="panel" id="addPanel" style="display:none;">
      <h2 style="margin:0 0 10px;">إضافة منتج</h2>

      <form id="productForm" class="checkout" enctype="multipart/form-data">
        <div class="row2">
          <input name="title" required placeholder="اسم المنتج"/>
          <input name="price" required placeholder="السعر" type="number" step="0.01" min="0"/>
        </div>

        <div class="row2">
          <select name="category" required>
            <option value="">اختار الفئة</option>
            <option value="Home & Kitchen">Home & Kitchen البيت والمطبخ</option>
            <option value="Toys">Toys الألعاب</option>
            <option value="Electronics">Electronics كهربائيات</option>
            <option value="Beauty">Beauty جمال</option>
            <option value="Fashion">Fashion أزياء</option>
          </select>
          <input name="stock" placeholder="الستوك" type="number" step="1" min="0" value="10"/>
        </div>

        <input name="description" required placeholder="وصف المنتج"/>
        <input type="file" name="image" accept="image/*" required />

        <button class="btnA" type="submit">إضافة المنتج</button>
        <div class="hint" id="prodMsg"></div>
      </form>

      <!-- PRODUCTS LIST -->
      <div class="listHead">
        <h2 style="margin:0;">المنتجات</h2>
        <button id="refresh" class="btnB" type="button">عرض المنتجات</button>
      </div>

      <div id="list" class="listBox"></div>
    </section>

  </main>

  <script src="/admin.js"></script>
</body>
</html>
